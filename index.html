    /* 🌟 담백한 방문자 수 표시 */
.visitor-simple {
  margin-top: 280px;
  margin-bottom: 25px;
  background: rgba(0, 0, 0, 0.6);
  padding: 6px 16px;
  border-radius: 4px;
  color: #fdf5e6;
  font-size: 14px;
  letter-spacing: 1px;
}
.visitor-simple span {
  color: #facc15;
  font-weight: bold;
}

    /* 화면 전환 기본 설정 */
    .screen { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      display: none; 
      flex-direction: column; 
      align-items: center; 
      z-index: 10; 
      padding: 20px; 
      transition: all 0.3s ease; 
    }

    .screen.active { 
      display: flex; 
    }

    /* 🌟 진행 화면: 살짝 어둡게 + 약한 블러 (배낭 집중) */
    #game-screen.active {
      background: rgba(0, 0, 0, 0.45); 
      backdrop-filter: blur(4px);      
    }

    /* 🌟 결과 화면: 더 어둡게 + 강한 블러 (결과창 강조) */
    #result-screen.active {
      background: rgba(0, 0, 0, 0.7); 
      backdrop-filter: blur(8px);      
      padding: 15px; 
      overflow-y: auto; 
    }

    .wood-box { background: #5c3a21; border: 4px solid #2e1c0d; color: #fdf5e6; padding: 18px 15px; width: 95%; box-shadow: inset -4px -4px 0 rgba(0,0,0,0.5), inset 4px 4px 0 rgba(255,255,255,0.2), 6px 6px 0 rgba(0,0,0,0.8); font-size: 16px; line-height: 1.8; margin-top: auto; margin-bottom: 20px; text-align: center; }
    .wood-btn { background: #8b5a2b; border: 4px solid #2e1c0d; color: #fff; font-size: 20px; padding: 14px 24px; cursor: pointer; box-shadow: inset -4px -4px 0 rgba(0,0,0,0.4), inset 4px 4px 0 rgba(255,255,255,0.3), 6px 6px 0 rgba(0,0,0,0.8); width: 85%; text-align: center; margin-bottom: 40px; text-shadow: 2px 2px 0 #000; transition: all 0.1s; }
    .wood-btn:active { transform: translate(4px, 4px); box-shadow: inset 2px 2px 0 rgba(0,0,0,0.4), 2px 2px 0 rgba(0,0,0,0.8); }

    .logo-container { margin-top: 20px; text-align: center; background: rgba(0,0,0,0.7); padding: 10px 20px; border: 4px dashed #f59e0b; width: 90%; }
    .logo-title { font-size: 45px; color: #a3e635; text-shadow: 4px 4px 0 #000; line-height: 1.2; margin-bottom: 5px; }
    .logo-sub { font-size: 16px; color: #facc15; letter-spacing: 1px; }

    .gauge-container { width: 100%; background: #2e1c0d; border: 4px solid #1a1007; padding: 12px; margin-top: 15px; box-shadow: 4px 4px 0 rgba(0,0,0,0.8); }
    .gauge-header { display: flex; justify-content: space-between; color: #fdf5e6; margin-bottom: 10px; font-size: 16px; font-weight: bold; }
    .gauge-bar-bg { width: 100%; height: 26px; background: #111; border: 2px inset #333; }
    .gauge-fill { height: 100%; background: repeating-linear-gradient(45deg, #16a34a, #16a34a 10px, #15803d 10px, #15803d 20px); width: 0%; transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: inset 0 4px 0 rgba(255,255,255,0.3); }

    .bag-wrapper {
      position: relative; margin-top: 20px; cursor: pointer; z-index: 20;
      width: 15em; height: 13em; font-size: 13px;
      filter: drop-shadow(8px 12px 0 rgba(0,0,0,0.7)); display: flex; justify-content: center; align-items: center;
      touch-action: manipulation; /* 🌟 연타 시 모바일 더블탭 확대 방지 */
    }
    
    /* 🌟 배낭 픽셀 그림은 스크립트(renderBag)가 단계별로 그려줍니다 */
    .pixel-bag {
      width: 1em; height: 1em; background: transparent; position: absolute; top: 0; left: 0;
    }

    /* 🌟 2단계(15번)부터 틈 사이로 빛이 새어 나오는 효과 */
    .bag-wrapper.glow { filter: drop-shadow(8px 12px 0 rgba(0,0,0,0.7)) drop-shadow(0 0 10px rgba(253, 224, 71, 0.7)); }

    .bag-wrapper.shake { animation: shake 0.15s steps(2) infinite; filter: drop-shadow(8px 12px 0 rgba(234, 179, 8, 0.4)); }
    .bag-wrapper.shake-hard { animation: shakeHard 0.1s steps(2) infinite; filter: drop-shadow(8px 12px 0 rgba(239, 68, 68, 0.5)); }
    
    .crash-effect { position: absolute; font-size: 40px; font-weight:bold; color: #fff; text-shadow: 4px 4px 0 #eab308, -4px -4px 0 #000; display: none; z-index: 30; animation: flash 0.2s infinite; }
    .sparkle-effect { font-size: 100px; display: none; z-index: 21; filter: drop-shadow(4px 4px 0 #000); }

    /* 🌟 단계가 바뀔 때 잠깐 뜨는 효과음 텍스트 (쩍! / 덜컥!) */
    .stage-pop {
      position: absolute; top: 8%; font-size: 34px; font-weight: bold; color: #fef08a;
      text-shadow: 3px 3px 0 #000; z-index: 31; pointer-events: none; display: none;
    }
    .stage-pop.show { display: block; animation: pop 0.6s ease-out forwards; }

    .result-title-box { background: #166534; border: 4px solid #86efac; padding: 12px 30px; font-size: 22px; color: #fff; margin-top: 10px; box-shadow: 4px 4px 0 #000; }
    .animal-sprite { 
  width: 140px;           /* 🌟 원하는 이미지 가로 크기 */
  height: 140px;          /* 🌟 원하는 이미지 세로 크기 */
  object-fit: contain;    /* 이미지 비율 유지 */
  image-rendering: auto; /* 🌟 3D 일러스트라 부드럽게 표시 */
  filter: drop-shadow(6px 6px 0 rgba(0,0,0,0.5)); 
  margin: 10px 0; 
  animation: bounce 1.5s infinite ease-in-out; 
}
    .animal-name { color: #facc15; font-size: 30px; margin-bottom: 10px; text-shadow: 2px 2px 0 #000; }
    .animal-badge { display: inline-block; background: #b45309; color: white; padding: 6px 12px; font-size: 15px; border: 2px solid #fff; margin-bottom: 15px; }
    
    #res-desc { font-size: 15px; color: #fdf5e6; padding-top: 15px; border-top: 2px dashed #8b5a2b; line-height: 1.7; word-break: keep-all; text-align: left; }
    
    .btn-group { display: flex; gap: 10px; width: 95%; margin-top: 5px; }
    .btn-group .wood-btn { flex: 1; font-size: 16px; padding: 14px 0; width: 100%; margin-bottom: 10px; }

    @keyframes shake { 0% { transform: translateX(-8px) rotate(-5deg); } 100% { transform: translateX(8px) rotate(5deg); } }
    @keyframes shakeHard { 0% { transform: translate(-15px, -5px) rotate(-10deg) scale(1.05); } 100% { transform: translate(15px, 5px) rotate(10deg) scale(1.05); } }
    @keyframes flash { 0% { color: #fff; } 50% { color: #fef08a; } 100% { color: #eab308; } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 30% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1) translateY(-20px); opacity: 0; } }
    /* 🌟 시작 화면의 텍스트 박스를 위쪽으로 배치 */
/* 🌟 1. 시작 화면 레이아웃 */
#start-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 20px 20px 20px;
  height: 100%;
  box-sizing: border-box;
}

/* 🌟 2. 누적 탐험가 박스 (현판 아래로 여유 있게 배치) */
.visitor-simple {
  margin-top: 300px; /* 👈 현판 바로 밑 위치 (210px ~ 240px 사이로 미세 조절 가능) */
  background: rgba(0, 0, 0, 0.65);
  border: 1px solid rgba(250, 204, 21, 0.4);
  padding: 6px 16px;
  border-radius: 20px;
  color: #fdf5e6;
  font-size: 13px;
  letter-spacing: 1px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
  z-index: 5;
}

.visitor-simple span {
  color: #facc15;
  font-weight: bold;
}

/* 🌟 3. 시작 버튼 (하단 안전 배치) */
#start-screen .wood-btn {
  margin-top: auto;   /* 위쪽 여백을 자동으로 밀어내 바닥에 고정 */
  margin-bottom: 25px; /* 컨테이너 테두리와의 여백 */
  width: 85%;
}
  </style>
</head>

  <div class="app-container">
   <!-- 1. 시작 화면 -->
<div id="start-screen" class="screen active">
  
  <!-- 🌟 담백한 한 줄 집계 UI -->
  <div class="visitor-simple">
    누적 탐험가 : <span id="total-visitors">...</span>명
  </div>

  <div class="wood-btn" onclick="startGame()">▶ 배낭 확인하기</div>
</div>

    <div id="game-screen" class="screen">
      <div class="gauge-container">

        </div>
      </div>

      <div style="flex:1; display:flex; justify-content:center; align-items:center; position:relative; width:100%;">

        <div class="bag-wrapper" id="backpack-img" style="font-size: 15px;">
          <div class="pixel-bag" id="inner-bag"></div>
          <div class="sparkle-effect" id="bag-sparkle"></div>
        </div>
      </div>

      <div class="wood-box">

      </div>
    </div>

    <div id="result-screen" class="screen">
      <div class="result-title-box">탐험 보고서</div>
      
    <img class="animal-sprite" id="res-img" src="" alt="천연기념물">
      
      <div class="wood-box" style="margin-bottom: 10px; padding: 20px;">

        <div id="res-desc"></div>
      </div>

      <div class="btn-group">
        <div class="wood-btn" style="background: #4a3018;" onclick="resetGame()">다시 시작</div>
        <div class="wood-btn" style="background: #166534;" onclick="shareGame()">더 알아보기!</div>
      </div>
    </div>
  </div>

        desc: '수컷 몸길이가 최대 12cm에 이르는 거대한 하늘소 대원입니다.<br>우리나라에서는 크고 오래된 서어나무 줄기 속에서 애벌레가 자라요.<br>사는 곳이 매우 좁아 지금은 아주 드물게만 발견되고 있습니다.<br>S-OIL 천연기념물 지킴이는 천연기념물곤충연구소와 함께 보호를 돕고 있어요.<br>숲에서 장수하늘소를 만나면 잡지 말고 사진으로만 남겨 주세요!'

    // 🌟 게임 설정값 (숫자만 바꾸면 난이도 조절 가능)
    const MAX_TAP = 30;        // 총 탭 횟수
    const STAGE1_TAP = 5;      // 1단계: 금이 가고 틈새로 빛이 샘
    const STAGE2_TAP = 15;     // 2단계: 덮개가 들리며 빛이 새어 나옴
    const HARD_SHAKE_TAP = 20; // 이 횟수부터 강하게 흔들림

    let tapCount = 0; let isGameOver = false;
    let shakeTimer;
    let currentAnimal = null;

    /* ===========================================================
       🌟 배낭 픽셀 그림 (단계별)
       글자 하나 = 픽셀 하나. 기존 배낭과 동일한 모양/색상입니다.
       D 진한 테두리 / L 밝은 가죽 / M 가죽 / B 어두운 가죽 / G 버클
       K 금(크랙) / Y, W 새어 나오는 빛 / . 빈칸
       =========================================================== */
    const PALETTE = { D:'#2e1c0d', L:'#b57d4c', M:'#8b5a2b', B:'#5c3a21', G:'#9ca3af', K:'#140b04', Y:'#facc15', W:'#fef9c3' };

    // 0단계: 기존 배낭 그대로
    const BAG_BASE = [
      '....DDDDDDDD...',
      '...DLLLLLLLLD..',
      '..DLMMMMMMMMLD.',
      '..DMMMMMMMMMMD.',
      '.DBBBBBBBBBBBBD',
      '.DLMMMMMMMMMMLD',
      '.DLMDDMMMMDDMLD',
      '.DMMDGDMMDGDMMD',
      '.DMMDGDMMDGDMMD',
      '.DMMDDMMMMDDMMD',
      '.DMMMMMMMMMMMMD',
      '.DBBBBBBBBBBBBD',
      '..DDDDDDDDDDDD.'
    ];

    // 1단계(5번): 덮개·몸통에 금이 가고, 덮개 이음새로 빛이 살짝 샘
    const BAG_CRACK = [
      '....DDDDDDDD...',
      '...DLLLLKLLLD..',
      '..DLMMMKMMMMLD.',
      '..DMMMMMKMMMMD.',
      '.DBBBBBYYBBBBBD',
      '.DLMMMMMMMMMMLD',
      '.DLMDDMMMMDDMLD',
      '.DMMDGDMKDGDMMD',
      '.DMMDGDKMDGDMMD',
      '.DMMDDMKMMDDMMD',
      '.DMMMMMMKMMMMMD',
      '.DBBBBBBBBBBBBD',
      '..DDDDDDDDDDDD.'
    ];

    // 2단계(15번): 금이 더 커지고, 덮개가 한 칸 들리며 그 틈으로 빛이 새어 나옴
    const BAG_OPEN_LID = [
      '....DDDDDDDD...',
      '...DLLLLKLLLD..',
      '..DLMMMKMMKMLD.',
      '..DMMKMMKMKMMD.',
      '.DBBKBBBBBBBBBD'
    ];
    const BAG_OPEN_GAP = '.DYYWYYYYYYWYYD';
    const BAG_OPEN_BODY = [
      '.DLMMKMMMMMMMLD',
      '.DLMDDMMMKDDMLD',
      '.DMMDGDMKDGDMMD',
      '.DMKDGDKMDGDKMD',
      '.DMMDDMKMMDDMMD',
      '.DMKMMMMKMMMKMD',
      '.DBBBBBBBBBBBBD',
      '..DDDDDDDDDDDD.'
    ];

    // 행 목록 [{y, row}] → CSS box-shadow 문자열로 변환
    function buildShadow(rows) {
      const parts = [];
      rows.forEach(({ y, row }) => {
        for (let x = 0; x < row.length; x++) {
          const color = PALETTE[row[x]];
          if (color) parts.push(`${x}em ${y}em ${color}`);
        }
      });
      return parts.join(', ');
    }

    const BAG_STAGES = [
      buildShadow(BAG_BASE.map((row, i) => ({ y: i, row }))),
      buildShadow(BAG_CRACK.map((row, i) => ({ y: i, row }))),
      buildShadow([
        ...BAG_OPEN_LID.map((row, i) => ({ y: i - 1, row })), // 덮개를 한 칸 위로 들어 올림
        { y: 4, row: BAG_OPEN_GAP },                          // 들린 틈 사이의 빛
        ...BAG_OPEN_BODY.map((row, i) => ({ y: i + 5, row }))
      ])
    ];

    let currentStage = -1;
    function renderBag(stage) {
      if (stage === currentStage) return;
      currentStage = stage;
      innerBag.style.boxShadow = BAG_STAGES[stage];
      backpackImg.classList.toggle('glow', stage >= 2);
    }

    function showStagePop(text) {
      stagePop.innerText = text;
      stagePop.classList.remove('show');
      void stagePop.offsetWidth; // 애니메이션 재시작용
      stagePop.classList.add('show');
    }

    const screens = { start: document.getElementById('start-screen'), game: document.getElementById('game-screen'), result: document.getElementById('result-screen') };
    const backpackImg = document.getElementById('backpack-img'); 
    const innerBag = document.getElementById('inner-bag');
    const bagSparkle = document.getElementById('bag-sparkle');
    const gaugeFill = document.getElementById('gauge-fill'); 
    const countText = document.getElementById('count-text'); 
    const crashText = document.getElementById('crash-text');
    const stagePop = document.getElementById('stage-pop');

    renderBag(0);

    function switchScreen(s) { Object.values(screens).forEach(scr => scr.classList.remove('active')); screens[s].classList.add('active'); }
    function startGame() { switchScreen('game'); }

    function tapBackpack(e) {
      e.preventDefault();
      if(isGameOver) return;
      
      tapCount++;
      gaugeFill.style.width = `${(tapCount / MAX_TAP) * 100}%`;
      countText.innerText = `${tapCount} / ${MAX_TAP}`;

      // 🌟 단계별로 배낭이 조금씩 열림
      if (tapCount === STAGE1_TAP) { renderBag(1); showStagePop('쩍!'); }
      if (tapCount === STAGE2_TAP) { renderBag(2); showStagePop('덜컥!'); }
      
      if (tapCount >= HARD_SHAKE_TAP) {
        backpackImg.classList.add('shake-hard');
        clearTimeout(shakeTimer);
        shakeTimer = setTimeout(() => backpackImg.classList.remove('shake-hard'), 200);
      } else {
        backpackImg.classList.add('shake');
        clearTimeout(shakeTimer);
        shakeTimer = setTimeout(() => backpackImg.classList.remove('shake'), 150);
      }

      if(tapCount >= MAX_TAP) {
        isGameOver = true; 
        backpackImg.classList.remove('shake');
        backpackImg.classList.remove('shake-hard');
        
        innerBag.style.display = 'none';
        bagSparkle.style.display = 'block';
        crashText.style.display = 'block'; 
        
        setTimeout(showResult, 1000);
      }
    }

    // 🌟 마우스·터치를 하나로 처리 (모바일에서 한 번 터치에 2번 세지는 문제 해결)
    backpackImg.addEventListener('pointerdown', tapBackpack);

    function showResult() {
  const p = animals[Math.floor(Math.random() * animals.length)];
  currentAnimal = p;
  document.getElementById('res-name').innerText = p.name;
  document.getElementById('res-badge').innerText = p.badge;
  document.getElementById('res-desc').innerHTML = p.desc;
  
  // 🌟 innerText 대신 src 속성에 이미지 파일 경로를 대입
  document.getElementById('res-img').src = p.img;
  
  switchScreen('result');
}

    function resetGame() {
      tapCount = 0; isGameOver = false; gaugeFill.style.width = '0%'; countText.innerText = `0 / ${MAX_TAP}`;
      innerBag.style.display = 'block'; bagSparkle.style.display = 'none';
      crashText.style.display = 'none';
      stagePop.classList.remove('show');
      backpackImg.classList.remove('glow');
      renderBag(0);
      switchScreen('start');
    }

    // 🌟 결과로 나온 천연기념물의 게시물로 이동 (링크가 없으면 계정 주소)
    function shareGame() {
      const url = (currentAnimal && currentAnimal.link) ? currentAnimal.link : FOREST_INSTA;
      window.open(url, '_blank');
    }

// 🌟 Abacus 전체 방문자 집계 (접속할 때마다 +1, 응답 = 올린 후 누적값)
async function updateVisitorCount() {
  const countElement = document.getElementById('total-visitors');
  const NAMESPACE = 'soil-4rest-basecamp'; // 우리 게임 전용 이름 (바꾸면 0부터 다시 시작)
  const KEY = 'explorers';

  try {
    // 10초 안에 응답이 없으면 중단하고 "집계 중" 표시
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 10000);
    const res = await fetch(`https://abacus.jasoncameron.dev/hit/${NAMESPACE}/${KEY}`, { cache: 'no-store', signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const r = await res.json();
    const n = Number(r && r.value);
    if (!Number.isFinite(n)) throw new Error('응답에 숫자가 없음');
    countElement.innerText = n.toLocaleString();
  } catch (error) {
    // 🌟 실패 시 가짜 숫자 대신 "집계 중" 표시
    console.warn('방문자 집계 실패:', error);
    countElement.innerText = '집계 중';
  }
}

window.addEventListener('DOMContentLoaded', updateVisitorCount);
  </script>
