<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4rest - 포레스트 베이스캠프</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@latest/neodgm/style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'NeoDunggeunmo', sans-serif; user-select: none; }
    body { background-color: #050505; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    
    /* 🌟 배경 이미지가 들어가는 메인 컨테이너 */
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 800px;
      background: url('공통배경화면.png') center/cover no-repeat;
      image-rendering: pixelated;
      position: relative;
      overflow: hidden;
      border: 4px solid #3e2723;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    /* 🌟 담백한 방문자 수 표시 */
.visitor-simple {
  margin-top: 280px;
  margin-bottom: 25px;
  background: rgba(0, 0, 0, 0.6);
  padding: 6px 16px;
  border-radius: 4px;
  color: #fdf5e6;
  font-size: 14px;
  letter-spacing: 1px;
}
.visitor-simple span {
  color: #facc15;
  font-weight: bold;
}

    /* 화면 전환 기본 설정 */
    .screen { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      display: none; 
      flex-direction: column; 
      align-items: center; 
      z-index: 10; 
      padding: 20px; 
      transition: all 0.3s ease; 
    }

    .screen.active { 
      display: flex; 
    }

    /* 🌟 진행 화면: 살짝 어둡게 + 약한 블러 (배낭 집중) */
    #game-screen.active {
      background: rgba(0, 0, 0, 0.45); 
      backdrop-filter: blur(4px);      
    }

    /* 🌟 결과 화면: 더 어둡게 + 강한 블러 (결과창 강조) */
    #result-screen.active {
      background: rgba(0, 0, 0, 0.7); 
      backdrop-filter: blur(8px);      
      padding: 15px; 
      overflow-y: auto; 
    }

    .wood-box { background: #5c3a21; border: 4px solid #2e1c0d; color: #fdf5e6; padding: 18px 15px; width: 95%; box-shadow: inset -4px -4px 0 rgba(0,0,0,0.5), inset 4px 4px 0 rgba(255,255,255,0.2), 6px 6px 0 rgba(0,0,0,0.8); font-size: 16px; line-height: 1.8; margin-top: auto; margin-bottom: 20px; text-align: center; }
    .wood-btn { background: #8b5a2b; border: 4px solid #2e1c0d; color: #fff; font-size: 20px; padding: 14px 24px; cursor: pointer; box-shadow: inset -4px -4px 0 rgba(0,0,0,0.4), inset 4px 4px 0 rgba(255,255,255,0.3), 6px 6px 0 rgba(0,0,0,0.8); width: 85%; text-align: center; margin-bottom: 40px; text-shadow: 2px 2px 0 #000; transition: all 0.1s; }
    .wood-btn:active { transform: translate(4px, 4px); box-shadow: inset 2px 2px 0 rgba(0,0,0,0.4), 2px 2px 0 rgba(0,0,0,0.8); }

    .logo-container { margin-top: 20px; text-align: center; background: rgba(0,0,0,0.7); padding: 10px 20px; border: 4px dashed #f59e0b; width: 90%; }
    .logo-title { font-size: 45px; color: #a3e635; text-shadow: 4px 4px 0 #000; line-height: 1.2; margin-bottom: 5px; }
    .logo-sub { font-size: 16px; color: #facc15; letter-spacing: 1px; }

    .gauge-container { width: 100%; background: #2e1c0d; border: 4px solid #1a1007; padding: 12px; margin-top: 15px; box-shadow: 4px 4px 0 rgba(0,0,0,0.8); }
    .gauge-header { display: flex; justify-content: space-between; color: #fdf5e6; margin-bottom: 10px; font-size: 16px; font-weight: bold; }
    .gauge-bar-bg { width: 100%; height: 26px; background: #111; border: 2px inset #333; }
    .gauge-fill { height: 100%; background: repeating-linear-gradient(45deg, #16a34a, #16a34a 10px, #15803d 10px, #15803d 20px); width: 0%; transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: inset 0 4px 0 rgba(255,255,255,0.3); }

    .bag-wrapper {
      position: relative; margin-top: 20px; cursor: pointer; z-index: 20;
      width: 15em; height: 13em; font-size: 13px;
      filter: drop-shadow(8px 12px 0 rgba(0,0,0,0.7)); display: flex; justify-content: center; align-items: center;
    }
    
    .pixel-bag {
      width: 1em; height: 1em; background: transparent; position: absolute; top: 0; left: 0;
      box-shadow:
        4em 0 #2e1c0d, 5em 0 #2e1c0d, 6em 0 #2e1c0d, 7em 0 #2e1c0d, 8em 0 #2e1c0d, 9em 0 #2e1c0d, 10em 0 #2e1c0d, 11em 0 #2e1c0d,
        3em 1em #2e1c0d, 4em 1em #b57d4c, 5em 1em #b57d4c, 6em 1em #b57d4c, 7em 1em #b57d4c, 8em 1em #b57d4c, 9em 1em #b57d4c, 10em 1em #b57d4c, 11em 1em #b57d4c, 12em 1em #2e1c0d,
        2em 2em #2e1c0d, 3em 2em #b57d4c, 4em 2em #8b5a2b, 5em 2em #8b5a2b, 6em 2em #8b5a2b, 7em 2em #8b5a2b, 8em 2em #8b5a2b, 9em 2em #8b5a2b, 10em 2em #8b5a2b, 11em 2em #8b5a2b, 12em 2em #b57d4c, 13em 2em #2e1c0d,
        2em 3em #2e1c0d, 3em 3em #8b5a2b, 4em 3em #8b5a2b, 5em 3em #8b5a2b, 6em 3em #8b5a2b, 7em 3em #8b5a2b, 8em 3em #8b5a2b, 9em 3em #8b5a2b, 10em 3em #8b5a2b, 11em 3em #8b5a2b, 12em 3em #8b5a2b, 13em 3em #2e1c0d,
        1em 4em #2e1c0d, 2em 4em #5c3a21, 3em 4em #5c3a21, 4em 4em #5c3a21, 5em 4em #5c3a21, 6em 4em #5c3a21, 7em 4em #5c3a21, 8em 4em #5c3a21, 9em 4em #5c3a21, 10em 4em #5c3a21, 11em 4em #5c3a21, 12em 4em #5c3a21, 13em 4em #5c3a21, 14em 4em #2e1c0d,
        1em 5em #2e1c0d, 2em 5em #b57d4c, 3em 5em #8b5a2b, 4em 5em #8b5a2b, 5em 5em #8b5a2b, 6em 5em #8b5a2b, 7em 5em #8b5a2b, 8em 5em #8b5a2b, 9em 5em #8b5a2b, 10em 5em #8b5a2b, 11em 5em #8b5a2b, 12em 5em #8b5a2b, 13em 5em #b57d4c, 14em 5em #2e1c0d,
        1em 6em #2e1c0d, 2em 6em #b57d4c, 3em 6em #8b5a2b, 4em 6em #2e1c0d, 5em 6em #2e1c0d, 6em 6em #8b5a2b, 7em 6em #8b5a2b, 8em 6em #8b5a2b, 9em 6em #8b5a2b, 10em 6em #2e1c0d, 11em 6em #2e1c0d, 12em 6em #8b5a2b, 13em 6em #b57d4c, 14em 6em #2e1c0d,
        1em 7em #2e1c0d, 2em 7em #8b5a2b, 3em 7em #8b5a2b, 4em 7em #2e1c0d, 5em 7em #9ca3af, 6em 7em #2e1c0d, 7em 7em #8b5a2b, 8em 7em #8b5a2b, 9em 7em #2e1c0d, 10em 7em #9ca3af, 11em 7em #2e1c0d, 12em 7em #8b5a2b, 13em 7em #8b5a2b, 14em 7em #2e1c0d,
        1em 8em #2e1c0d, 2em 8em #8b5a2b, 3em 8em #8b5a2b, 4em 8em #2e1c0d, 5em 8em #9ca3af, 6em 8em #2e1c0d, 7em 8em #8b5a2b, 8em 8em #8b5a2b, 9em 8em #2e1c0d, 10em 8em #9ca3af, 11em 8em #2e1c0d, 12em 8em #8b5a2b, 13em 8em #8b5a2b, 14em 8em #2e1c0d,
        1em 9em #2e1c0d, 2em 9em #8b5a2b, 3em 9em #8b5a2b, 4em 9em #2e1c0d, 5em 9em #2e1c0d, 6em 9em #8b5a2b, 7em 9em #8b5a2b, 8em 9em #8b5a2b, 9em 9em #8b5a2b, 10em 9em #2e1c0d, 11em 9em #2e1c0d, 12em 9em #8b5a2b, 13em 9em #8b5a2b, 14em 9em #2e1c0d,
        1em 10em #2e1c0d, 2em 10em #8b5a2b, 3em 10em #8b5a2b, 4em 10em #8b5a2b, 5em 10em #8b5a2b, 6em 10em #8b5a2b, 7em 10em #8b5a2b, 8em 10em #8b5a2b, 9em 10em #8b5a2b, 10em 10em #8b5a2b, 11em 10em #8b5a2b, 12em 10em #8b5a2b, 13em 10em #8b5a2b, 14em 10em #2e1c0d,
        1em 11em #2e1c0d, 2em 11em #5c3a21, 3em 11em #5c3a21, 4em 11em #5c3a21, 5em 11em #5c3a21, 6em 11em #5c3a21, 7em 11em #5c3a21, 8em 11em #5c3a21, 9em 11em #5c3a21, 10em 11em #5c3a21, 11em 11em #5c3a21, 12em 11em #5c3a21, 13em 11em #5c3a21, 14em 11em #2e1c0d,
        2em 12em #2e1c0d, 3em 12em #2e1c0d, 4em 12em #2e1c0d, 5em 12em #2e1c0d, 6em 12em #2e1c0d, 7em 12em #2e1c0d, 8em 12em #2e1c0d, 9em 12em #2e1c0d, 10em 12em #2e1c0d, 11em 12em #2e1c0d, 12em 12em #2e1c0d, 13em 12em #2e1c0d;
    }

    .bag-wrapper.shake { animation: shake 0.15s steps(2) infinite; filter: drop-shadow(8px 12px 0 rgba(234, 179, 8, 0.4)); }
    .bag-wrapper.shake-hard { animation: shakeHard 0.1s steps(2) infinite; filter: drop-shadow(8px 12px 0 rgba(239, 68, 68, 0.5)); }
    
    .crash-effect { position: absolute; font-size: 40px; font-weight:bold; color: #fff; text-shadow: 4px 4px 0 #eab308, -4px -4px 0 #000; display: none; z-index: 30; animation: flash 0.2s infinite; }
    .sparkle-effect { font-size: 100px; display: none; z-index: 21; filter: drop-shadow(4px 4px 0 #000); }

    .result-title-box { background: #166534; border: 4px solid #86efac; padding: 12px 30px; font-size: 22px; color: #fff; margin-top: 10px; box-shadow: 4px 4px 0 #000; }
    .animal-sprite { 
  width: 140px;           /* 🌟 원하는 이미지 가로 크기 */
  height: 140px;          /* 🌟 원하는 이미지 세로 크기 */
  object-fit: contain;    /* 이미지 비율 유지 */
  image-rendering: pixelated; /* 픽셀 아트 선명도 유지 */
  filter: drop-shadow(6px 6px 0 rgba(0,0,0,0.5)); 
  margin: 10px 0; 
  animation: bounce 1.5s infinite ease-in-out; 
}
    .animal-name { color: #facc15; font-size: 30px; margin-bottom: 10px; text-shadow: 2px 2px 0 #000; }
    .animal-badge { display: inline-block; background: #b45309; color: white; padding: 6px 12px; font-size: 15px; border: 2px solid #fff; margin-bottom: 15px; }
    
    #res-desc { font-size: 15px; color: #fdf5e6; padding-top: 15px; border-top: 2px dashed #8b5a2b; line-height: 1.7; word-break: keep-all; text-align: left; }
    
    .btn-group { display: flex; gap: 10px; width: 95%; margin-top: 5px; }
    .btn-group .wood-btn { flex: 1; font-size: 16px; padding: 14px 0; width: 100%; margin-bottom: 10px; }

    @keyframes shake { 0% { transform: translateX(-8px) rotate(-5deg); } 100% { transform: translateX(8px) rotate(5deg); } }
    @keyframes shakeHard { 0% { transform: translate(-15px, -5px) rotate(-10deg) scale(1.05); } 100% { transform: translate(15px, 5px) rotate(10deg) scale(1.05); } }
    @keyframes flash { 0% { color: #fff; } 50% { color: #fef08a; } 100% { color: #eab308; } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    /* 🌟 시작 화면의 텍스트 박스를 위쪽으로 배치 */
/* 🌟 1. 시작 화면 레이아웃 */
#start-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 20px 20px 20px;
  height: 100%;
  box-sizing: border-box;
}

/* 🌟 2. 누적 탐험가 박스 (현판 아래로 여유 있게 배치) */
.visitor-simple {
  margin-top: 300px; /* 👈 현판 바로 밑 위치 (210px ~ 240px 사이로 미세 조절 가능) */
  background: rgba(0, 0, 0, 0.65);
  border: 1px solid rgba(250, 204, 21, 0.4);
  padding: 6px 16px;
  border-radius: 20px;
  color: #fdf5e6;
  font-size: 13px;
  letter-spacing: 1px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
  z-index: 5;
}

.visitor-simple span {
  color: #facc15;
  font-weight: bold;
}

/* 🌟 3. 시작 버튼 (하단 안전 배치) */
#start-screen .wood-btn {
  margin-top: auto;   /* 위쪽 여백을 자동으로 밀어내 바닥에 고정 */
  margin-bottom: 25px; /* 컨테이너 테두리와의 여백 */
  width: 85%;
}
  </style>
</head>
<body>

  <div class="app-container">
   <!-- 1. 시작 화면 -->
<div id="start-screen" class="screen active">
  
  <!-- 🌟 담백한 한 줄 집계 UI -->
  <div class="visitor-simple">
    누적 탐험가 : <span id="total-visitors">0</span>명
  </div>

  <div class="wood-btn" onclick="startGame()">▶ 배낭 확인하기</div>
</div>

    <!-- 2. 진행 화면 -->
    <div id="game-screen" class="screen">
      <div class="gauge-container">
        <div class="gauge-header">
          <span>가방 열기 (TAP)</span>
          <span id="count-text">0 / 10</span>
        </div>
        <div class="gauge-bar-bg">
          <div class="gauge-fill" id="gauge-fill"></div>
        </div>
      </div>

      <div style="flex:1; display:flex; justify-content:center; align-items:center; position:relative; width:100%;">
        <div class="crash-effect" id="crash-text">!!!</div>
        <div class="bag-wrapper" id="backpack-img" style="font-size: 15px;">
          <div class="pixel-bag" id="inner-bag"></div>
          <div class="sparkle-effect" id="bag-sparkle"></div>
        </div>
      </div>

      <div class="wood-box">
        수상하게 움직이는 낡은 가죽 배낭을<br>열어보세요.
      </div>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="result-screen" class="screen">
      <div class="result-title-box">탐험 보고서</div>
      
    <img class="animal-sprite" id="res-img" src="" alt="천연기념물">
      
      <div class="wood-box" style="margin-bottom: 10px; padding: 20px;">
        <div class="animal-name" id="res-name">남생이</div>
        <div class="animal-badge" id="res-badge">천연기념물 제453호</div>
        <div id="res-desc"></div>
      </div>

      <div class="btn-group">
        <div class="wood-btn" style="background: #4a3018;" onclick="resetGame()">다시 시작</div>
        <div class="wood-btn" style="background: #166534;" onclick="shareGame()">더 알아보기!</div>
      </div>
    </div>
  </div>

  <script>
    const animals = [
      { 
        name: '남생이', badge: '천연기념물 제453호', img: '남생이img.png',
        desc: '맑은 하천과 습지에 서식하는 우리나라 고유종 대원입니다.<br>잡식성으로 수생태계의 청소부 역할을 톡톡히 해내고 있죠.<br>현재 외래종의 유입과 서식지 파괴로 큰 위협을 받고 있습니다.<br>모래톱이 있는 깨끗한 하천이 있어야만 번식할 수 있어요.<br>건강한 하천 생태계를 지켜주는 것이 남생이를 보호하는 길입니다.' 
      },
      { 
        name: '두루미', badge: '천연기념물 제202호', img: '두루미img.png',
        desc: '겨울철 우리나라를 찾아오는 크고 우아한 귀한 철새 대원입니다.<br>가족 단위로 생활하며, 얕은 물가에서 미꾸라지나 다슬기를 먹어요.<br>농약 사용과 무분별한 개발로 인해 안전한 서식지가 줄고 있습니다.<br>마음 놓고 먹이를 구하고 쉴 수 있는 고요한 습지가 필요해요.<br>철새들이 매년 찾아올 수 있도록 깨끗한 자연환경을 보존해야 합니다.' 
      },
      { 
        name: '수달', badge: '천연기념물 제330호', img: '수달img.png',
        desc: '맑은 하천과 호숫가를 누비는 수생태계의 최상위 포식자 대원입니다.<br>귀여운 외모와 달리 물고기를 날쌔게 사냥하는 멋진 사냥꾼이죠.<br>과거 무분별한 남획과 수질 오염으로 인해 개체수가 급감했습니다.<br>먹이가 풍부하고 몸을 숨길 수 있는 깨끗한 수변 공간이 필수적이에요.<br>우리가 버리는 쓰레기를 줄이고 수질을 맑게 유지해야 함께할 수 있습니다.' 
      },
      { 
        name: '황쏘가리', badge: '천연기념물 제190호', img: '황쏘가리img.png', 
        desc: '남한강 수계의 맑은 물에 서식하는 아주 희귀한 특산어종 대원입니다.<br>특유의 아름다운 황금빛 체색을 지닌 돌연변이 종으로 가치가 높아요.<br>야간에 활동하며 돌 틈에 숨어 작은 물고기를 사냥하는 육식성입니다.<br>수질 오염과 무분별한 포획 때문에 국가적인 보호가 시급한 상황이에요.<br>우리 하천의 맑고 차가운 물을 지켜주어야 황쏘가리 대원이 살아갑니다.' 
      },
      { 
        name: '장수하늘소', badge: '천연기념물 제218호', img: '장수하늘소img.png', 
        desc: '오래된 활엽수림에 서식하는 가장 거대한 덩치를 자랑하는 대원입니다.<br>주로 서어나무 숲에서 살아가며, 애벌레로 수년간 지내다 성충이 됩니다.<br>기후 변화와 숲의 파괴로 인해 현재는 극소수의 개체만 발견되고 있어요.<br>오랜 세월을 버텨온 건강하고 거대한 숲이 있어야만 명맥을 이을 수 있습니다.<br>나무를 심고 오래된 숲을 보존하는 것이 장수하늘소를 지키는 유일한 방법입니다.' 
      }
    ];

    let tapCount = 0; const MAX_TAP = 3; let isGameOver = false;
    let shakeTimer;

    const screens = { start: document.getElementById('start-screen'), game: document.getElementById('game-screen'), result: document.getElementById('result-screen') };
    const backpackImg = document.getElementById('backpack-img'); 
    const innerBag = document.getElementById('inner-bag');
    const bagSparkle = document.getElementById('bag-sparkle');
    const gaugeFill = document.getElementById('gauge-fill'); 
    const countText = document.getElementById('count-text'); 
    const crashText = document.getElementById('crash-text');

    function switchScreen(s) { Object.values(screens).forEach(scr => scr.classList.remove('active')); screens[s].classList.add('active'); }
    function startGame() { switchScreen('game'); }

    function tapBackpack(e) {
      if(e.type === 'touchend') e.preventDefault();
      if(isGameOver) return;
      
      tapCount++;
      gaugeFill.style.width = `${(tapCount / MAX_TAP) * 100}%`;
      countText.innerText = `${tapCount} / ${MAX_TAP}`;
      
      if (tapCount >= 8) {
        backpackImg.classList.add('shake-hard');
        clearTimeout(shakeTimer);
        shakeTimer = setTimeout(() => backpackImg.classList.remove('shake-hard'), 200);
      } else {
        backpackImg.classList.add('shake');
        clearTimeout(shakeTimer);
        shakeTimer = setTimeout(() => backpackImg.classList.remove('shake'), 150);
      }

      if(tapCount >= MAX_TAP) {
        isGameOver = true; 
        backpackImg.classList.remove('shake');
        backpackImg.classList.remove('shake-hard');
        
        innerBag.style.display = 'none';
        bagSparkle.style.display = 'block';
        crashText.style.display = 'block'; 
        
        setTimeout(showResult, 1000);
      }
    }

    backpackImg.addEventListener('mousedown', tapBackpack); 
    backpackImg.addEventListener('touchstart', tapBackpack);

    function showResult() {
  const p = animals[Math.floor(Math.random() * animals.length)];
  document.getElementById('res-name').innerText = p.name;
  document.getElementById('res-badge').innerText = p.badge;
  document.getElementById('res-desc').innerHTML = p.desc;
  
  // 🌟 innerText 대신 src 속성에 이미지 파일 경로를 대입
  document.getElementById('res-img').src = p.img;
  
  switchScreen('result');
}

    function resetGame() {
      tapCount = 0; isGameOver = false; gaugeFill.style.width = '0%'; countText.innerText = `0 / ${MAX_TAP}`;
      innerBag.style.display = 'block'; bagSparkle.style.display = 'none';
      crashText.style.display = 'none'; switchScreen('start');
    }

/* 🌟 변경 후 코드 */
function shareGame() {
  window.open('https://www.instagram.com/s_oil_forest?igsh=MWtlMzh1Mm51YWhmZA%3D%3D%EA%B3%84%EC%A0%95', '_blank');
}
    // 🌟 페이지 접속 시 방문자 집계 (+1)
// 🌟 0부터 시작하여 접속 시마다 +1 되는 글로벌 카운터
async function updateVisitorCount() {
  const countElement = document.getElementById('total-visitors');
  
  // 고유 프로젝트 키 (초기값: 0)
  const namespace = '4rest_camp_explorer_2026';
  const key = 'total_visitors';

  try {
    // 1. 카운트 1 증가 API 호출 (0부터 자동 누적)
    const response = await fetch(`https://api.counterapi.dev/v1/${namespace}/${key}/up`);
    
    if (response.ok) {
      const data = await response.json();
      if (data && typeof data.count === 'number') {
        countElement.innerText = data.count.toLocaleString();
        return;
      }
    }
  } catch (error) {
    console.warn('API 통신 제한(로컬 실행 등)으로 브라우저 로컬 카운터를 사용합니다.');
  }

  // 2. 로컬 실행(file://) 등 API 차단 시 로컬스토리지로 0부터 +1 집계
  let localCount = parseInt(localStorage.getItem('4rest_visitor_count') || '0', 10) + 1;
  localStorage.setItem('4rest_visitor_count', localCount);
  countElement.innerText = localCount.toLocaleString();
}

window.addEventListener('DOMContentLoaded', updateVisitorCount);

window.addEventListener('DOMContentLoaded', updateVisitorCount);
  </script>
